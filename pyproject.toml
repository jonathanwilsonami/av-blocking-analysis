[project]
name = "av-blocking"
version = "0.1.0"
description = "Frequency, hazard classification, and risk-matrix analysis of autonomous-vehicle (robotaxi) blocking incidents in San Francisco."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Jonathan Wilson" }, { name = "Chujiang (CJ) Wu" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "tabulate>=0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Optional pretrained-model cross-checks (CPU-only torch; large downloads):
# zero-shot NLI (BART-MNLI, DeBERTa-v3) and embedding similarity.
nlp = [
    "transformers>=4.40",
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "sentencepiece>=0.2",  # DeBERTa-v3 tokenizer
    "protobuf>=4.25",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "jupyterlab>=4",
    "ipykernel>=6",
    "nbconvert>=7",
    "nbformat>=5",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/av_blocking"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
